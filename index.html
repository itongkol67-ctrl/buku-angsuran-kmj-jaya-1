<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Lapangan Koperasi</title>
    <!-- Tailwind CSS untuk styling cepat dan rapi di HP -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800">

    <div class="max-w-md mx-auto min-h-screen bg-white shadow-lg flex flex-col">
        <!-- Header Aplikasi -->
        <header class="bg-emerald-700 text-white p-4 shadow-md">
            <h1 class="text-lg font-bold">Koperasi Lapangan</h1>
            <p class="text-xs text-emerald-100">Input Setoran & Data Nasabah</p>
        </header>

        <!-- Konten Utama -->
        <main class="p-4 flex-1 space-y-6">
            
            <!-- Tab Menu (Pilih Aksi) -->
            <div class="flex rounded-lg bg-slate-200 p-1 text-sm font-medium">
                <button onclick="switchTab('setoran')" id="btn-setoran" class="flex-1 py-2 rounded-md bg-white shadow text-emerald-700 transition">Setoran Harian</button>
                <button onclick="switchTab('nasabah')" id="btn-nasabah" class="flex-1 py-2 rounded-md text-slate-600 transition">Tambah Nasabah</button>
            </div>

            <!-- FORM 1: INPUT SETORAN HARIAN -->
            <section id="form-setoran" class="space-y-4">
                <h2 class="text-base font-semibold text-slate-700 border-b pb-2">Catat Setoran Harian</h2>
                
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Pilih / Cari Nasabah</label>
                    <select id="select-nasabah" class="w-full rounded-lg border border-slate-300 p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                        <option value="">-- Memuat Data Nasabah --</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Tanggal Bayar</label>
                    <input type="date" id="tanggal_bayar" class="w-full rounded-lg border border-slate-300 p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Jumlah Bayar (Rp)</label>
                    <input type="number" id="jumlah_bayar" placeholder="Contoh: 150000" class="w-full rounded-lg border border-slate-300 p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Nama / ID Petugas</label>
                    <input type="text" id="id_petugas" placeholder="Nama Petugas Lapangan" class="w-full rounded-lg border border-slate-300 p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <button onclick="simpanSetoran()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg text-sm shadow transition">
                    Simpan Setoran
                </button>
            </section>

            <!-- FORM 2: TAMBAH NASABAH BARU -->
            <section id="form-nasabah" class="space-y-4 hidden">
                <h2 class="text-base font-semibold text-slate-700 border-b pb-2">Tambah Data Nasabah Baru</h2>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">No. Anggota (NA)</label>
                        <input type="text" id="no_anggota" placeholder="Cth: 03" class="w-full rounded-lg border border-slate-300 p-2 text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">No. Pinjaman (NP)</label>
                        <input type="text" id="no_pinjaman" placeholder="Cth: I atau II" class="w-full rounded-lg border border-slate-300 p-2 text-sm outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Tanggal Drop</label>
                    <input type="date" id="tanggal_drop" class="w-full rounded-lg border border-slate-300 p-2 text-sm outline-none">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Nama Nasabah</label>
                    <input type="text" id="nama_nasabah" placeholder="Nama lengkap nasabah" class="w-full rounded-lg border border-slate-300 p-2 text-sm outline-none">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Alamat</label>
                    <input type="text" id="alamat" placeholder="Cth: M. Bulian / KMP. 6" class="w-full rounded-lg border border-slate-300 p-2 text-sm outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Besar Pinjaman (Rp)</label>
                        <input type="number" id="besar_pinjaman" placeholder="700000" class="w-full rounded-lg border border-slate-300 p-2 text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Sisa Saldo Awal (Rp)</label>
                        <input type="number" id="sisa_saldo" placeholder="750000" class="w-full rounded-lg border border-slate-300 p-2 text-sm outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">No. WhatsApp</label>
                    <input type="text" id="no_wa" placeholder="08xxxxxxxxxx" class="w-full rounded-lg border border-slate-300 p-2 text-sm outline-none">
                </div>

                <button onclick="simpanNasabah()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm shadow transition">
                    Simpan Nasabah Baru
                </button>
            </section>

        </main>
    </div>

    <!-- Konfigurasi Skrip JavaScript & Koneksi Supabase -->
    <script>
        // ISI DENGAN Kredensial SUPABASE MILIK ANDA
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Otomatis isi tanggal hari ini pada form
        document.getElementById('tanggal_bayar').valueAsDate = new Date();
        document.getElementById('tanggal_drop').valueAsDate = new Date();

        // Fungsi Ganti Tab Menu
        function switchTab(tab) {
            const formSetoran = document.getElementById('form-setoran');
            const formNasabah = document.getElementById('form-nasabah');
            const btnSetoran = document.getElementById('btn-setoran');
            const btnNasabah = document.getElementById('btn-nasabah');

            if (tab === 'setoran') {
                formSetoran.classList.remove('hidden');
                formNasabah.classList.add('hidden');
                btnSetoran.className = "flex-1 py-2 rounded-md bg-white shadow text-emerald-700 transition";
                btnNasabah.className = "flex-1 py-2 rounded-md text-slate-600 transition";
                loadNasabahToSelect();
            } else {
                formNasabah.classList.remove('hidden');
                formSetoran.classList.add('hidden');
                btnNasabah.className = "flex-1 py-2 rounded-md bg-white shadow text-blue-700 transition";
                btnSetoran.className = "flex-1 py-2 rounded-md text-slate-600 transition";
            }
        }

        // Ambil data nasabah untuk pilihan dropdown setoran
        async function loadNasabahToSelect() {
            const select = document.getElementById('select-nasabah');
            select.innerHTML = '<option value="">-- Memuat Data --</option>';
            
            const { data, error } = await _supabase.from('nasabah').select('id, nama_nasabah, alamat').order('nama_nasabah', { ascending: true });
            
            if (error) {
                console.error('Gagal memuat nasabah:', error);
                select.innerHTML = '<option value="">Gagal memuat data</option>';
                return;
            }

            select.innerHTML = '<option value="">-- Pilih Nasabah --</option>';
            data.forEach(n => {
                let opt = document.createElement('option');
                opt.value = n.id;
                opt.textContent = `${n.nama_nasabah} (${n.alamat || 'Tanpa Alamat'})`;
                select.appendChild(opt);
            });
        }

        // Simpan Data Nasabah Baru ke Supabase
        async function simpanNasabah() {
            const no_anggota = document.getElementById('no_anggota').value;
            const no_pinjaman = document.getElementById('no_pinjaman').value;
            const tanggal_drop = document.getElementById('tanggal_drop').value;
            const nama_nasabah = document.getElementById('nama_nasabah').value;
            const alamat = document.getElementById('alamat').value;
            const besar_pinjaman = parseFloat(document.getElementById('besar_pinjaman').value) || 0;
            const sisa_saldo = parseFloat(document.getElementById('sisa_saldo').value) || 0;
            const no_wa = document.getElementById('no_wa').value;

            if (!nama_nasabah) {
                alert('Nama nasabah wajib diisi!');
                return;
            }

            const { error } = await _supabase.from('nasabah').insert([{
                no_anggota, no_pinjaman, tanggal_drop, nama_nasabah, alamat, besar_pinjaman, sisa_saldo, no_wa
            }]);

            if (error) {
                alert('Gagal menyimpan: ' + error.message);
            } else {
                alert('Data nasabah berhasil disimpan!');
                // Bersihkan form
                document.getElementById('nama_nasabah').value = '';
                document.getElementById('besar_pinjaman').value = '';
                document.getElementById('sisa_saldo').value = '';
                document.getElementById('no_wa').value = '';
                switchTab('setoran');
            }
        }

        // Simpan Transaksi Setoran & Update Sisa Saldo Otomatis
        async function simpanSetoran() {
            const id_nasabah = document.getElementById('select-nasabah').value;
            const tanggal_bayar = document.getElementById('tanggal_bayar').value;
            const jumlah_bayar = parseFloat(document.getElementById('jumlah_bayar').value) || 0;
            const id_petugas = document.getElementById('id_petugas').value;

            if (!id_nasabah || jumlah_bayar <= 0) {
                alert('Pilih nasabah dan masukkan jumlah bayar dengan benar!');
                return;
            }

            // 1. Simpan ke tabel transaksi_bayar
            const { error: errTrans } = await _supabase.from('transaksi_bayar').insert([{
                id_nasabah, tanggal_bayar, jumlah_bayar, id_petugas
            }]);

            if (errTrans) {
                alert('Gagal menyimpan setoran: ' + errTrans.message);
                return;
            }

            // 2. Ambil sisa_saldo saat ini dari tabel nasabah
            const { data: dataNasabah, errGet } = await _supabase.from('nasabah').select('sisa_saldo').eq('id', id_nasabah).single();
            
            if (dataNasabah) {
                let saldoBaru = (dataNasabah.sisa_saldo || 0) - jumlah_bayar;
                if (saldoBaru < 0) saldoBaru = 0;

                // 3. Update sisa_saldo terbaru di tabel nasabah secara otomatis
                await _supabase.from('nasabah').update({ sisa_saldo: saldoBaru }).eq('id', id_nasabah);
            }

            alert('Setoran berhasil dicatat & saldo otomatis terupdate!');
            document.getElementById('jumlah_bayar').value = '';
        }

        // Jalankan saat halaman pertama kali dibuka
        loadNasabahToSelect();
    </script>
</body>
</html>
